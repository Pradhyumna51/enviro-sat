[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eurosat-monitoring"
version = "0.1.0"
description = "Portfolio-quality satellite land-use monitoring system based on EuroSAT Sentinel-2 imagery."
readme = "DATASET.md"
requires-python = ">=3.9"
authors = [
    { name = "Enviro-Sat Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "kagglehub>=0.2.0",
    "python-dotenv>=1.0.0",
    "wandb>=0.15.0",
    "notebook>=7.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
